[package]
name = "clientless"
description = "Clientless live tests: exercise Zaino's service layer over its gRPC/JSON-RPC surface against a live validator, on the ztest k8s harness (no wallet client)."
publish = false

authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
version = "0.2.0"

[features]
default = []

[dependencies]
ztest = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
zaino-testutils = { workspace = true }
ztest = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rstest.workspace = true
# `test_vectors.rs` parses committed transaction vectors through the
# independent `legacy_parser`; no validator, no cluster.
wire_serialized_transaction_test_data = { workspace = true }

# Zingo-infra
zcash_local_net = { workspace = true }
# The served JSON schema. These tests compare Zaino's domain answers against a
# raw JSON-RPC oracle, so they render the domain side through the same wire
# types the server uses.
zaino-serve = { workspace = true, features = ["prometheus"] }
zaino-primitives.workspace = true
zaino-rpc.workspace = true
zaino-consensus.workspace = true
zaino-status.workspace = true
metrics.workspace = true
metrics-util = "0.20.1"
tracing.workspace = true
tracing-subscriber.workspace = true
tonic.workspace = true
